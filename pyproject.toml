[project]
name = "scenepilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kiri5358", email = "lth980730@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.153.0",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
scenepilot = "scenepilot:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
